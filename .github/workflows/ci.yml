name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Check Pigeon drift
        run: |
          dart run pigeon --input pigeons/platform.dart
          git -c core.autocrlf=false diff --ignore-space-at-eol --exit-code -- pigeons/platform.dart lib/platform/generated/platform_api.g.dart android/app/src/main/kotlin/app/packingproof/mobile/generated/PlatformApi.kt ios/Runner/Generated/PlatformApi.swift
      - name: Android unit tests
        working-directory: android
        run: .\gradlew.bat :app:testDebugUnitTest --no-daemon

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - name: Build iOS without codesigning
        run: flutter build ios --no-codesign

  ios-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true
      - run: flutter pub get
      - name: Run iOS native tests
        run: |
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -quiet
